name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지 않고 큐에 쌓는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test

      - run: bun run build

      # v2 회원 앱(app/)을 같은 사이트의 app/ 아래에 싣는다.
      # 키가 비면 데모 모드(이 기기에만 저장)로 빌드되므로, 그때는 배포를 멈춘다.
      # 값은 저장소 Settings → Secrets and variables → Actions → Variables 에 둔다.
      # anon 키는 번들에 그대로 실리는 공개 값이라 Secret 이 아니어도 된다.
      - name: Build v2 (app/)
        env:
          NINETEEN_SUPABASE_URL: ${{ vars.NINETEEN_SUPABASE_URL }}
          NINETEEN_SUPABASE_ANON_KEY: ${{ vars.NINETEEN_SUPABASE_ANON_KEY }}
          # 네이버 로그인 Client ID(공개값). 없으면 네이버 버튼 없이 배포된다 — 막지 않는다.
          NINETEEN_NAVER_CLIENT_ID: ${{ vars.NINETEEN_NAVER_CLIENT_ID }}
        run: |
          if [ -z "$NINETEEN_SUPABASE_URL" ] || [ -z "$NINETEEN_SUPABASE_ANON_KEY" ]; then
            echo "::error::저장소 Variables 에 NINETEEN_SUPABASE_URL · NINETEEN_SUPABASE_ANON_KEY 가 없습니다."
            exit 1
          fi
          bun run app:build
          cp -r app/dist dist/app

      # 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 바꿔둬야 한다.
      # `enablement: true` 로 자동화할 수 없다 — 그 옵션은 PUT /repos/.../pages 를
      # 호출하는데 admin 권한이 필요하고, 워크플로의 GITHUB_TOKEN 은 admin 이 아니다.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
