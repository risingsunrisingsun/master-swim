<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>나인틴 · 목표 페이스</title>
    <meta name="description" content="목표기록에서 훈련 페이스와 세트를 계산하는 마스터즈 수영 도구" />
    <meta name="theme-color" content="#0868e8" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <!-- iOS 홈화면 아이콘은 PNG 만 받는다. SVG 를 주면 화면 캡처가 대신 쓰인다. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header id="topbar" hidden>
        <a class="back" href="#/home" id="back">‹ 뒤로</a>
        <h1 id="screen-title">나인틴</h1>
        <p class="hint" id="screen-sub"></p>
      </header>

      <!-- 시작 화면 (ENTER) -->
      <section id="screen-splash"></section>

      <!-- 메뉴 -->
      <section id="screen-home" hidden></section>

      <!-- 목표 기록 훈련법 -->
      <section id="screen-training" hidden>
        <form id="form" autocomplete="off">
          <div class="row">
            <label>
              영법
              <select id="stroke">
                <option value="free">자유형</option>
                <option value="back">배영</option>
                <option value="breast">평영</option>
                <option value="fly">접영</option>
              </select>
            </label>
            <label>
              거리
              <select id="distance">
                <option value="25">25m</option>
                <option value="50">50m</option>
                <option value="100" selected>100m</option>
              </select>
            </label>
          </div>

          <div class="row">
            <label>
              현재기록
              <!-- 숫자 키패드에는 콜론이 없다. 숫자만 받아 오른쪽부터 채운다. -->
              <input id="current" type="text" inputmode="numeric" autocomplete="off" placeholder="12500" />
              <span class="echo" id="current-echo"></span>
            </label>
            <label>
              목표기록
              <input id="target" type="text" inputmode="numeric" autocomplete="off" placeholder="12000" />
              <span class="echo" id="target-echo"></span>
            </label>
          </div>
          <p class="hint">
            기록은 <strong>숫자만</strong> 누르세요. 뒤에서부터 1/100초 · 초 · 분으로 채워집니다 —
            <code>12345</code> → 1:23.45, <code>2345</code> → 23.45
          </p>

          <div class="row">
            <label>
              연령부
              <select id="age-group">
                <option value="25-29">25-29</option>
                <option value="30-34">30-34</option>
                <option value="35-39">35-39</option>
                <option value="40-44">40-44</option>
                <option value="45-49" selected>45-49</option>
                <option value="50-54">50-54</option>
                <option value="55-59">55-59</option>
                <option value="60-64">60-64</option>
                <option value="65-69">65-69</option>
                <option value="70+">70+</option>
              </select>
            </label>
            <label>
              성별
              <select id="sex">
                <option value="M">남</option>
                <option value="F">여</option>
              </select>
            </label>
          </div>

          <div class="row">
            <label>
              주간 훈련 횟수
              <input id="sessions" type="number" min="1" max="7" step="1" value="3" />
            </label>
            <label>
              세션당 거리 (m)
              <input id="meters" type="number" min="500" max="8000" step="100" value="2000" />
            </label>
          </div>

          <!-- 식단이 주요 기능이 된 뒤로 이 두 칸을 접어두면 안 된다.
               앞서 <details> 로 감췄다가 회원이 찾지 못했다. -->
          <h2>식단 계산용 (선택)</h2>
          <div class="row">
            <label>
              키 (cm)
              <input id="height" type="number" min="120" max="220" step="1" placeholder="172" />
            </label>
            <label>
              체중 (kg)
              <input id="weight" type="number" min="35" max="160" step="0.5" placeholder="68" />
            </label>
          </div>
          <p class="hint">
            안 넣으면 훈련 플랜만 나옵니다. 넣으면 식단이 계산되고, 이 두 값은
            <strong>이 기기에만 저장됩니다</strong> — 서버로 보내는 코드가 없어 코치도 팀원도
            볼 수 없습니다.
          </p>

          <div class="actions">
            <button id="show-plan" type="button">이번 주 플랜 보기</button>
            <span class="saved" id="saved" aria-live="polite"></span>
          </div>
        </form>

        <section id="result" aria-live="polite"></section>
      </section>

      <!-- 개인기록 추이 -->
      <section id="screen-records" hidden>
        <form id="record-form" autocomplete="off">
          <div class="row">
            <label>
              영법
              <select id="r-stroke">
                <option value="free">자유형</option>
                <option value="back">배영</option>
                <option value="breast">평영</option>
                <option value="fly">접영</option>
                <option value="im">개인혼영</option>
              </select>
            </label>
            <label>
              거리
              <select id="r-distance">
                <option value="25">25m</option>
                <option value="50">50m</option>
                <option value="100" selected>100m</option>
              </select>
            </label>
          </div>
          <!-- 날짜와 기록을 한 줄에 두면 iOS 날짜 입력이 칸을 넘쳐 겹친다.
               min-width 를 풀어도 좁은 화면에서는 빠듯하므로 줄을 나눈다. -->
          <label>
            날짜
            <input id="r-date" type="date" />
          </label>
          <label>
            기록
            <input id="r-time" type="text" inputmode="numeric" autocomplete="off" placeholder="12345" />
            <span class="echo" id="r-echo"></span>
          </label>
          <div class="actions">
            <button id="add-record" type="button">기록 추가</button>
            <span class="saved" id="record-saved" aria-live="polite"></span>
          </div>
        </form>

        <section id="records-result" aria-live="polite"></section>
      </section>

      <footer>
        <p>
          이 도구는 훈련 참고용입니다. 심혈관 질환·당뇨·관절 부상 이력이 있거나 통증이 있으면
          의료 전문가와 상의한 뒤 훈련하세요. 제시된 강도와 식단은 개인의 건강 상태를
          고려하지 않습니다.
        </p>
      </footer>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
